name: Node CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory of the npm project"
        type: string
        default: "."
      lint-scripts:
        description: 'npm scripts for the job "Lint and format", space-separated, run in order'
        type: string
        default: "lint format typecheck"
      test-scripts:
        description: 'npm scripts for the job "Unit tests", space-separated, run in order'
        type: string
        default: "test"
      coverage-summary:
        description: "coverage-summary.json written by the tests, relative to working-directory; its coverage/ directory is uploaded (optional)"
        type: string
        default: ""
      e2e-script:
        description: 'npm script for the job "End-to-end tests" with Playwright (optional)'
        type: string
        default: ""
      package-script:
        description: 'npm script for the job "Package checks" (optional)'
        type: string
        default: ""

permissions: {}

jobs:
  lint:
    name: Lint and format
    if: inputs.lint-scripts != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # some lint scripts look at the commit range
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint scripts
        env:
          SCRIPTS: ${{ inputs.lint-scripts }}
        run: |
          for script in $SCRIPTS; do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done

  unit:
    name: Unit tests
    if: inputs.test-scripts != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run test scripts
        env:
          SCRIPTS: ${{ inputs.test-scripts }}
        run: |
          for script in $SCRIPTS; do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done
      - name: Write coverage summary
        if: always() && inputs.coverage-summary != ''
        uses: $/actions/coverage-summary
        with:
          summary-file: ${{ inputs.working-directory }}/${{ inputs.coverage-summary }}
      - name: Upload coverage report
        if: always() && inputs.coverage-summary != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ inputs.working-directory }}/coverage
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: End-to-end tests
    if: inputs.e2e-script != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
      - name: Install Playwright browsers
        run: npx --no -- playwright install --with-deps # --no: only the project's own Playwright, never a download
      - name: Run end-to-end tests
        env:
          SCRIPT: ${{ inputs.e2e-script }}
        run: npm run "$SCRIPT"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            ${{ inputs.working-directory }}/playwright-report
            ${{ inputs.working-directory }}/test-results
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package checks
    if: inputs.package-script != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run package script
        env:
          SCRIPT: ${{ inputs.package-script }}
        run: npm run "$SCRIPT"
