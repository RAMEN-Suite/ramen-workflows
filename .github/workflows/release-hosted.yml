name: Release (hosted app)

on:
  workflow_call:
    inputs:
      notices:
        description: "Directories whose third-party NOTICES.md is regenerated into the release commit, e.g. client server"
        type: string
        default: ""
      release-as:
        description: "Force a version X.Y.Z (default: from the conventional commits)"
        type: string
        default: ""
      dry-run:
        description: "Bump and build the notes, but push and release nothing"
        type: boolean
        default: false
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: "Private key of the release App (its client ID comes from vars.RELEASE_GITHUB_CLIENT_ID)"
        required: true
    outputs:
      version:
        description: "Released version, without the leading v"
        value: ${{ jobs.prepare.outputs.version }}

permissions: {}

jobs:
  prepare:
    name: Version and notes
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the commit is not released yet
        if: ${{ inputs.release-as == '' }}
        run: |
          released=$(git tag --points-at HEAD --list 'v*' | paste -sd ' ' -)
          if [ -n "$released" ]; then
            echo "::error::$GITHUB_SHA is already released ($released); nothing to release, use release-as to force a version"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the release tools
        run: npm ci
      - name: Regenerate the third-party notices
        env:
          NOTICES: ${{ inputs.notices }}
        run: |
          for dir in $NOTICES; do
            npm ci --prefix "$dir" # generate-license-file reads the installed packages
            npx --no -- generate-license-file --input "$dir/package.json" --output "$dir/NOTICES.md" --overwrite --ci --no-spinner
            git add "$dir/NOTICES.md"
          done
      - name: Bump version and update changelog
        id: bump
        env:
          RELEASE_AS: ${{ inputs.release-as }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx --no -- commit-and-tag-version --commit-all \
            --releaseCommitMessageFormat "chore(release): {{currentTag}} [skip ci]" \
            ${RELEASE_AS:+--release-as "$RELEASE_AS"}
          tag=$(git describe --exact-match --tags HEAD)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Bundle the release commit and the notes
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          mkdir release
          git bundle create release/release.bundle "refs/tags/v$VERSION" "^$GITHUB_SHA"
          awk '/^#{2,3} \[?v?[0-9]+\.[0-9]+\.[0-9]+/ { c++; if (c == 2) exit } c == 1' CHANGELOG.md > release/notes.md
          cat release/notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          retention-days: 1

  publish:
    name: Push and release
    needs: [prepare]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # checkout only; the push and the release go through the release App token
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the release commit
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git fetch release/release.bundle "refs/tags/v$VERSION:refs/tags/v$VERSION"
          unexpected=$(git diff --name-only HEAD "v$VERSION" | grep -vE '^(CHANGELOG\.md|([^/]+/)?package\.json|[^/]+/NOTICES\.md)$' | tr '\n' ' ' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::The release commit changes more than version, changelog and notices: $unexpected"
            exit 1
          fi
      - name: Create an app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # release commit, tag and GitHub release
      - name: Push and release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git push --atomic "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "v$VERSION^{commit}:refs/heads/main" "refs/tags/v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file release/notes.md
