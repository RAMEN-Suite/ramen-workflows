name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

env:
  # renovate: datasource=github-releases depName=zizmorcore/zizmor extractVersion=^v(?<version>.+)$
  ZIZMOR_VERSION: "1.31.1"

jobs:
  zizmor:
    name: Run Zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required for uploading results to code scanning
      contents: read # only needed for private repos — needed to clone the repo
      actions: read # only needed for private repos — needed for upload-sarif to read workflow run info
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: ${{ github.event.repository.visibility == 'public' }}

  actionlint:
    name: Run actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read # only needed for private repos — needed to clone the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
