name: OpenSSF Scorecard

on:
  push:
    branches: [main] # Scorecard only supports the default branch
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required for uploading the results to code scanning
      id-token: write # required for publish_results: proves to api.scorecard.dev that this workflow produced them
      contents: read # required for actions/checkout and Scorecard's file checks if this repo is private
      actions: read # required for upload-sarif to read workflow run info in private repos
      issues: read # Scorecard's Maintained check reads issue activity (needed in private repos)
      pull-requests: read # Scorecard's Code-Review check reads merged pull requests (needed in private repos)
      checks: read # Scorecard's CI-Tests and SAST checks read check runs (needed in private repos)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload results as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
