name: "Test: Supply chain"

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  supply-chain:
    name: "Test: Supply chain"
    uses: $/.github/workflows/supply-chain.yml
    with:
      include-dev-deps: true # this repository has only devDependencies (commitlint)
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
