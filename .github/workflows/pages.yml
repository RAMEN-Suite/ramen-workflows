name: Pages

on:
  workflow_call:
    inputs:
      build-script:
        description: "npm script that builds the site into path"
        type: string
        required: true
      path:
        description: "Directory with the built site, relative to working-directory"
        type: string
        required: true
      ref:
        description: "Git ref to build, e.g. the release tag (default: the commit of the run)"
        type: string
        default: ""
      working-directory:
        description: "Directory of the npm project"
        type: string
        default: "."
      dry-run:
        description: "Build and upload the site, but don't deploy it"
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build the site
        env:
          SCRIPT: ${{ inputs.build-script }}
        run: npm run "$SCRIPT"
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.path }}

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write # required to deploy to GitHub Pages
      id-token: write # required for actions/deploy-pages to verify the deployment origin
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
