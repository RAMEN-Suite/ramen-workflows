name: "Test: Config lint"

on:
  push:
    branches: [main, "deps/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  config-lint:
    name: "Test: Config lint"
    uses: $/.github/workflows/config-lint.yml
    with:
      dockerfiles: fixtures/docker-app/Dockerfile
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      security-events: write # required for uploading results to code scanning
