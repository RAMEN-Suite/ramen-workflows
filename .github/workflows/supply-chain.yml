name: Supply chain

on:
  workflow_call:
    inputs:
      include-dev-deps:
        description: "Also scan the licenses of devDependencies (by default trivy only scans what ships)"
        type: boolean
        default: false

permissions: {}

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: "v0.76.1"

jobs:
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Scan licenses with trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: ${{ inputs.include-dev-deps }}
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          format: json
          output: trivy-licenses.json
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL" # inventory only, the gate is the step below
          exit-code: "0"
          version: ${{ env.TRIVY_VERSION }}
      - name: Write license summary
        if: always()
        uses: $/actions/license-summary
        with:
          report-file: trivy-licenses.json

      - name: Check licenses
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: ${{ inputs.include-dev-deps }}
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          format: table
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-licenses
          path: trivy-licenses.json
          if-no-files-found: ignore
          retention-days: 30
