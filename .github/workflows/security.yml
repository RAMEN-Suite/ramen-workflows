name: Security

on:
  workflow_call:
    inputs:
      semgrep-configs:
        description: "Semgrep rulesets, space-separated"
        type: string
        default: "p/security-audit p/secrets"
      codeql-languages:
        description: "CodeQL languages, comma-separated (interpreted languages only: build-mode none)"
        type: string
        default: "javascript-typescript"
      codeql-config-file:
        description: "Path of a CodeQL config file in the calling repository (optional)"
        type: string
        default: ""

permissions: {}

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: "v0.76.1"

jobs:
  security:
    name: Vulnerability and secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      security-events: write # required for uploading results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required for gitleaks to scan the history
          persist-credentials: false
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          version: ${{ env.TRIVY_VERSION }}
      - name: Run gitleaks
        if: success() || failure()
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --redact --report-format sarif --report-path gitleaks.sarif .
      - name: Upload trivy report to security tab
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
      - name: Upload gitleaks report to security tab
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-results-${{ github.sha }}
          path: |
            trivy-results.sarif
            gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14
      - name: Write trivy summary
        if: always()
        uses: $/actions/sarif-summary
        with:
          sarif-file: trivy-results.sarif
          title: 🔍 Trivy
      - name: Write gitleaks summary
        if: always()
        uses: $/actions/sarif-summary
        with:
          sarif-file: gitleaks.sarif
          title: 🔐 Gitleaks

  sast:
    name: SAST scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      security-events: write # required for uploading results to code scanning
    container:
      image: semgrep/semgrep:1.167.0@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
      - name: Run Semgrep
        env:
          SEMGREP_RULES: ${{ inputs.semgrep-configs }}
        run: semgrep scan --severity ERROR --error --sarif --output semgrep.sarif
      - name: Upload Semgrep results to Github Security tab
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: sast
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 14
      - name: Write Semgrep summary
        if: always()
        uses: $/actions/sarif-summary
        with:
          sarif-file: semgrep.sarif
          title: 🧪 Semgrep

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      security-events: write # required for uploading results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ inputs.codeql-languages }}
          build-mode: none
          config-file: ${{ inputs.codeql-config-file }}
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ inputs.codeql-languages }}
