# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
"""
body = """
{%- set repo = "https://github.com/RAMEN-Suite/ramen-workflows" -%}
{% if version and previous.version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/compare/{{ previous.version }}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% elif version -%}
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## Unreleased
{% endif -%}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking %}
### ⚠ BREAKING CHANGES
{% for commit in breaking %}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.breaking_description }}
{%- endfor %}
{% endif -%}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) -%}
{% if entry.group != "hidden" %}
### {{ entry.group }}
{% for commit in entry.commits %}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{%- endfor %}
{% endif -%}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/RAMEN-Suite/ramen-workflows/issues/${2}))" },
]
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = '^feat', group = "Features" },
  { message = '^fix', group = "Bug Fixes" },
  { message = '^perf', group = "Performance" },
  { message = '^refactor', group = "Refactoring" },
  { message = '^docs', group = "Documentation" },
  { message = '^revert', group = "Reverts" },
  { message = '.*', group = "hidden" },
]
protect_breaking_commits = true
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "oldest"

[bump]
features_always_bump_minor = false
breaking_always_bump_major = false
initial_tag = "v0.1.0"
