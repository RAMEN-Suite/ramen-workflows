name: Coverage summary
description: Write an istanbul coverage-summary.json (json-summary reporter) as a table to the job summary

inputs:
  summary-file:
    description: Path of coverage-summary.json
    required: true

runs:
  using: composite
  steps:
    - name: Write summary
      shell: bash
      env:
        SUMMARY_FILE: ${{ inputs.summary-file }}
      run: bash "$GITHUB_ACTION_PATH/summary.sh" # via bash: works even if the file lost its executable bit
